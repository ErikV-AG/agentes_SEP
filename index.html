<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Person-AG</title>

    <!-- Tipografía institucional 2024-2030:
         Patria (títulos) no se distribuye en Google Fonts. Si tienen los
         archivos, colóquenlos en static/fonts/ con estos nombres y se
         usarán automáticamente; si no, cae a Noto Serif.
         Noto Sans es la tipografía de texto de los sitios gob.mx. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Patria';
            src: local('Patria'), url('static/fonts/Patria-Regular.woff2') format('woff2');
            font-weight: 400; font-display: swap;
        }
        @font-face {
            font-family: 'Patria';
            src: local('Patria Bold'), url('static/fonts/Patria-Bold.woff2') format('woff2');
            font-weight: 700; font-display: swap;
        }

        /* ── Paleta institucional Gobierno de México 2024-2030 ───────── */
        :root {
            --guinda:        #9b2247;  /* Pantone 7420 C */
            --guinda-oscuro: #611232;  /* Pantone 7421 C */
            --verde:         #1e5b4f;  /* Pantone 626 C  */
            --verde-oscuro:  #002f2a;
            --dorado:        #a57f2c;  /* Pantone 1255 C */
            --dorado-claro:  #e6d194;  /* Pantone 7402 C */
            --negro:         #161a1d;  /* Neutral Black C */
            --gris:          #98989a;
            --gris-texto:    #545454;
            --linea:         #e4e1da;
            --fondo:         #ffffff;
            --fondo-suave:   #f6f5f2;

            --f-titulo: 'Patria', 'Noto Serif', Georgia, serif;
            --f-texto:  'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--f-texto);
            font-size: 16px;
            line-height: 1.5;
            color: var(--negro);
            background: var(--fondo);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── Barra superior guinda con pleca dorada (patrón gob.mx) ──── */
        .barra {
            background: var(--guinda-oscuro);
            border-bottom: 3px solid var(--dorado);
            padding-top: env(safe-area-inset-top, 0px);
        }
        .barra-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #fff;
        }
        .barra-logo {
            height: 32px;
            width: auto;
            display: block;
        }
        .barra-nombre {
            font-family: var(--f-titulo);
            font-size: 1.125rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        /* ── Contenido ──────────────────────────────────────────────── */
        main {
            flex: 1;
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding: 56px 24px 72px;
        }
        .intro { max-width: 640px; margin-bottom: 44px; }
        .intro h1 {
            font-family: var(--f-titulo);
            font-weight: 700;
            font-size: clamp(2rem, 4.2vw, 2.875rem);
            line-height: 1.12;
            color: var(--guinda-oscuro);
            margin-bottom: 14px;
        }
        .intro p {
            color: var(--gris-texto);
            font-size: 1.0625rem;
            max-width: 56ch;
        }

        /* ── Tarjetas de agente ─────────────────────────────────────── */
        .agentes {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px;
            list-style: none;
        }
        .agente {
            --tono: var(--guinda);
            appearance: none;
            width: 100%;
            text-align: left;
            font: inherit;
            color: inherit;
            background: var(--fondo);
            border: 1px solid var(--linea);
            border-top: 5px solid var(--tono);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .agente[data-agent="benito"]  { --tono: var(--guinda); }
        .agente[data-agent="leona"]   { --tono: var(--verde); }
        .agente[data-agent="rosario"] { --tono: var(--dorado); }

        .agente:hover {
            border-color: var(--tono);
            box-shadow: 0 10px 28px -14px rgba(97, 18, 50, 0.35);
        }
        .agente:focus-visible {
            outline: 3px solid var(--dorado);
            outline-offset: 3px;
        }

        .agente-foto {
            position: relative;
            aspect-ratio: 4 / 5;
            background: var(--fondo-suave);
            overflow: hidden;
        }
        .agente-foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
        }
        /* Respaldo si falta el GIF: iniciales sobre el color del agente */
        .agente-iniciales {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: var(--f-titulo);
            font-weight: 700;
            font-size: 4.5rem;
            color: #fff;
            background: var(--tono);
        }
        .agente-foto.sin-imagen img { display: none; }
        .agente-foto.sin-imagen .agente-iniciales { display: flex; }

        .agente-texto {
            padding: 20px 22px 22px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        .agente-nombre {
            font-family: var(--f-titulo);
            font-weight: 700;
            font-size: 1.5rem;
            line-height: 1.2;
            color: var(--negro);
        }
        .agente-fechas {
            font-size: 0.875rem;
            color: var(--gris);
            font-variant-numeric: tabular-nums;
        }
        .agente-rol {
            margin-top: 8px;
            font-size: 0.9375rem;
            color: var(--gris-texto);
        }
        .agente-accion {
            margin-top: auto;
            padding-top: 18px;
            font-weight: 600;
            font-size: 0.9375rem;
            color: var(--tono);
        }
        .agente[data-agent="rosario"] .agente-accion { color: #7d5f1d; } /* contraste AA */

        .agente.cargando { pointer-events: none; opacity: .7; }

        /* ── Pie ────────────────────────────────────────────────────── */
        .pie {
            background: var(--guinda-oscuro);
            color: rgba(255,255,255,.8);
            font-size: 0.8125rem;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pie-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        /* ── Responsivo ─────────────────────────────────────────────── */
        @media (max-width: 860px) {
            .agentes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        }
        @media (max-width: 560px) {
            main { padding: 36px 18px 48px; }
            .intro { margin-bottom: 28px; }
            .agentes { grid-template-columns: 1fr; }
            /* En celular: foto a la izquierda, texto a la derecha */
            .agente { flex-direction: row; border-top-width: 1px; border-left: 5px solid var(--tono); }
            .agente-foto { aspect-ratio: auto; width: 38%; min-height: 150px; flex-shrink: 0; }
            .agente-iniciales { font-size: 2.5rem; }
            .agente-texto { padding: 16px; }
            .agente-nombre { font-size: 1.25rem; }
            .agente-accion { padding-top: 10px; }
            .pie-inner { flex-direction: column; gap: 4px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

<header class="barra">
    <div class="barra-inner">
        <img src="static/images/LOGO-AG-GRUESO.png" alt="" class="barra-logo" onerror="this.remove()">
        <span class="barra-nombre">Person-AG</span>
    </div>
</header>

<main>
    <section class="intro">
        <h1>¿Con quién deseas hablar hoy?</h1>
        <p>Elige a un personaje de nuestra historia y conversa con él o ella por voz o por escrito.</p>
    </section>

    <ul class="agentes" aria-label="Agentes disponibles">
        <li>
            <button class="agente" type="button" data-agent="benito" data-url="agente-embed.html?key=benito">
                <div class="agente-foto">
                    <img src="static/images/benito-idle.gif" alt="">
                    <span class="agente-iniciales" aria-hidden="true">BJ</span>
                </div>
                <div class="agente-texto">
                    <span class="agente-nombre">Benito Juárez</span>
                    <span class="agente-fechas">1806 – 1872</span>
                    <span class="agente-rol">La Reforma, la República y el respeto al derecho ajeno.</span>
                    <span class="agente-accion">Hablar con Benito</span>
                </div>
            </button>
        </li>
        <li>
            <button class="agente" type="button" data-agent="leona" data-url="agente-embed.html?key=leona">
                <div class="agente-foto">
                    <img src="static/images/leona-idle.gif" alt="">
                    <span class="agente-iniciales" aria-hidden="true">LV</span>
                </div>
                <div class="agente-texto">
                    <span class="agente-nombre">Leona Vicario</span>
                    <span class="agente-fechas">1789 – 1842</span>
                    <span class="agente-rol">La Independencia contada por una de sus insurgentes.</span>
                    <span class="agente-accion">Hablar con Leona</span>
                </div>
            </button>
        </li>
        <li>
            <button class="agente" type="button" data-agent="rosario" data-url="agente-embed.html?key=rosario">
                <div class="agente-foto">
                    <img src="static/images/rosario-idle.gif" alt="">
                    <span class="agente-iniciales" aria-hidden="true">RC</span>
                </div>
                <div class="agente-texto">
                    <span class="agente-nombre">Rosario Castellanos</span>
                    <span class="agente-fechas">1925 – 1974</span>
                    <span class="agente-rol">Literatura, poesía y la voz de las mujeres en México.</span>
                    <span class="agente-accion">Hablar con Rosario</span>
                </div>
            </button>
        </li>
    </ul>
</main>

<footer class="pie">
    <div class="pie-inner">
        <span>Person-AG · Agentes conversacionales</span>
        <span>v3.0</span>
    </div>
</footer>

<script>
    // Autenticación
    if (sessionStorage.getItem('ag_auth') !== 'true') window.location.href = 'login.html';

    // Si falta un GIF, mostrar iniciales en su lugar
    // (Sin carga diferida: en Safari/Firefox, "complete" daba falsos
    //  errores con loading="lazy" y ocultaba GIFs que sí existían.)
    document.querySelectorAll('.agente-foto img').forEach(img => {
        const marcar = () => {
            img.parentElement.classList.add('sin-imagen');
            console.warn('[index] No se encontró la imagen:', img.src);
        };
        img.addEventListener('error', marcar);
        if (img.complete && img.naturalWidth === 0) marcar();
    });

    // Selección de agente → página embed
    document.querySelectorAll('.agente').forEach(btn => {
        btn.addEventListener('click', () => {
            btn.classList.add('cargando');
            window.location.href = btn.dataset.url;
        });
    });

    // Al volver con "atrás" (bfcache) quitar el estado de carga
    window.addEventListener('pageshow', e => {
        if (e.persisted) document.querySelectorAll('.agente.cargando')
            .forEach(b => b.classList.remove('cargando'));
    });
</script>
</body>
</html>
