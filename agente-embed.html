<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Person-AG</title>

    <!-- Seguro contra shadow DOM cerrado.
         El embed v2 de D-ID abre sus shadow roots (por eso benito.html
         funciona sin este parche), pero si en alguna versión los cerrara,
         la traducción dejaría de alcanzarlos. Forzar mode:'open' antes de
         cargar el SDK cuesta nada y no altera el widget visualmente.

         Debe ir como script clásico (no module) en el <head>, ANTES de
         cualquier otra cosa que pueda crear shadow DOMs. -->
    <script>
        (function () {
            const orig = Element.prototype.attachShadow;
            Element.prototype.attachShadow = function (init) {
                const opts = Object.assign({}, init, { mode: 'open' });
                return orig.call(this, opts);
            };
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base:    #070d1a;
            --border:     rgba(255,255,255,0.07);
            --text:       #e8edf5;
            --text-muted: rgba(232,237,245,0.55);
            --accent:     #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overscroll-behavior: none;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59,130,246,0.12) 0%, transparent 60%);
            color: var(--text);
            overflow: hidden;
        }

        /* Botón flotante para volver al selector.
           Respeta el notch y la barra de estado del celular. */
        .back-btn {
            position: fixed;
            top:  calc(16px + env(safe-area-inset-top, 0px));
            left: calc(16px + env(safe-area-inset-left, 0px));
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(0,0,0,0.55);
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.15s ease, border-color 0.15s ease;
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }
        .back-btn svg { fill: currentColor; }

        /* Container del agente. Empieza OCULTO con opacity:0 para que la UI
           inicial del widget de D-ID (textos en inglés, spinners propios) no
           sea visible al usuario hasta que esté listo.

           100dvh = altura visible real en móvil (sin la zona que tapa la
           barra del navegador). 100vh queda como respaldo. */
        #did-container {
            position: fixed;
            inset: 0;
            height: 100vh;
            height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 1;
        }
        #did-container.ready { opacity: 1; }

        /* Loader nuestro — cubre todo el viewport hasta el reveal */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: var(--bg-base);
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59,130,246,0.12) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: var(--text-muted);
            font-size: 14px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loaderText {
            font-size: 13px;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            min-height: 1.2em;
            transition: opacity 0.3s ease;
        }
        #loaderSubtext {
            font-size: 11px;
            color: rgba(232,237,245,0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: -8px;
        }

        /* Mensaje de error */
        .error-msg {
            position: fixed;
            inset: 0;
            z-index: 15;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 24px;
            background: var(--bg-base);
        }
        .error-msg.show { display: flex; }
        .error-msg h2 { font-size: 1.2rem; font-weight: 600; }
        .error-msg p { color: var(--text-muted); font-size: 14px; max-width: 360px; }

        /* Celular: botón compacto, solo flecha, para no encimarse con los
           controles del encabezado de D-ID. */
        @media (max-width: 480px) {
            .back-btn {
                top:  calc(10px + env(safe-area-inset-top, 0px));
                left: calc(10px + env(safe-area-inset-left, 0px));
                padding: 7px 10px;
                font-size: 12px;
                gap: 4px;
            }
            .back-btn .back-label { display: none; }
        }
    </style>
</head>
<body>

    <a href="/" class="back-btn" title="Volver al selector de agentes" aria-label="Volver al selector de agentes">
        <svg viewBox="0 0 24 24" width="14" height="14">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        <span class="back-label">Volver</span>
    </a>

    <div id="did-container"></div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <span id="loaderText">Cargando agente…</span>
        <span id="loaderSubtext">Person-AG</span>
    </div>

    <div class="error-msg" id="errorMsg">
        <h2>No se pudo cargar el agente</h2>
        <p id="errorDetail">Verifica que el agente exista y que tenga configurado el embed de D-ID.</p>
    </div>

    <script>
        // Auth check
        if (sessionStorage.getItem('ag_auth') !== 'true') {
            window.location.href = '/login';
        }

        (async function () {
            'use strict';

            const params      = new URLSearchParams(window.location.search);
            const agentKey    = params.get('key');
            const loader      = document.getElementById('loader');
            const loaderText  = document.getElementById('loaderText');
            const container   = document.getElementById('did-container');
            const errorEl     = document.getElementById('errorMsg');
            const errorDt     = document.getElementById('errorDetail');
            const backBtn     = document.querySelector('.back-btn');

            function showError(msg) {
                if (msg) errorDt.textContent = msg;
                errorEl.classList.add('show');
                loader.classList.add('hidden');
            }

            if (!agentKey) {
                showError('Falta el parámetro "key" en la URL. Ejemplo: /agente?key=hayek');
                return;
            }

            // ── Config del agente ─────────────────────────────────────────
            let cfg = null;
            try {
                const res    = await fetch('/api/agents');
                const allCfg = await res.json();
                cfg          = allCfg[agentKey];
            } catch (err) {
                showError('No se pudo obtener la configuración del agente.');
                return;
            }

            if (!cfg)                                            { showError(`El agente "${agentKey}" no existe en la configuración.`); return; }
            if (!cfg.use_embed)                                  { showError(`El agente "${cfg.name || agentKey}" no está configurado para modo embed.`); return; }
            if (!cfg.did_agent_id || !cfg.did_client_key)        { showError('Faltan did_agent_id o did_client_key.'); return; }

            // ── Loader animado ────────────────────────────────────────────
            document.title         = `${cfg.name || agentKey} — Person-AG`;
            loaderText.textContent = `Cargando ${cfg.name || agentKey}…`;

            const mensajes = [
                `Cargando ${cfg.name || agentKey}…`,
                'Preparando interacción…',
                'Casi listo…',
            ];
            let idx = 0;
            const msgInterval = setInterval(() => {
                idx = Math.min(idx + 1, mensajes.length - 1);
                loaderText.style.opacity = '0';
                setTimeout(() => {
                    loaderText.textContent = mensajes[idx];
                    loaderText.style.opacity = '1';
                }, 250);
            }, 3500);

            /* ==============================================================
               DICCIONARIO DEL EMBED D-ID v2 (build 2.1.27)

               Las llaves son las cadenas EXACTAS del bundle, en minúsculas;
               la búsqueda normaliza a minúsculas antes de comparar. Esto es
               lo que fallaba antes: el diccionario anterior tenía cadenas
               inventadas ("Start conversation", "Listening…", "Click to
               talk") que el widget nunca emite, y comparaba respetando
               mayúsculas.

               El widget solo trae inglés y alemán de fábrica: no existe
               opción de configuración para español, por eso se parchea el
               DOM.

               "call" se traduce siempre como "conversación", no "llamada".
            ============================================================== */
            const TRADUCCIONES = {

                /* ---------- Arranque / conexión ---------- */
                'start call':                    'Iniciar conversación',
                'starting...':                   'Iniciando...',
                'connecting...':                 'Conectando...',
                'loading...':                    'Cargando...',

                /* Pantalla de conexión (build posterior al 2.1.27).
                   Se registran la frase completa y sus dos mitades por
                   separado: según el build, D-ID la parte en dos elementos
                   o la deja en un solo nodo de texto. */
                'connecting call...':            'Conectando…',
                'setting up your agent. this usually takes a few seconds.':
                  'Preparando al agente. Esto suele tardar unos segundos.',
                'setting up your agent.':        'Preparando al agente.',
                'setting up your agent':         'Preparando al agente',
                'this usually takes a few seconds.':
                  'Esto suele tardar unos segundos.',
                'this usually takes a few seconds':
                  'Esto suele tardar unos segundos',

                'hang tight':                    'Un momento',
                'reconnect':                     'Reconectar',
                'continue call...':              'Continuar conversación...',
                "let's continue":                'Continuemos',
                'create new call':               'Crear nueva conversación',
                'start a new call':              'Iniciar una nueva conversación',
                'want to continue where we left off?': '¿Quieres continuar donde nos quedamos?',
                'are you still here?':           '¿Sigues ahí?',
                'call ended':                    'Conversación finalizada',
                'understood':                    'Entendido',
                'skip':                          'Omitir',
                'close':                         'Cerrar',

                /* ---------- Controles de conversación ---------- */
                'end call':                      'Terminar conversación',
                'turn microphone on':            'Encender micrófono',
                'mute microphone':               'Silenciar micrófono',
                'unmute microphone':             'Activar micrófono',
                'turn off speakers':             'Apagar bocinas',
                'turn on captions':              'Activar subtítulos',
                'turn off captions':             'Desactivar subtítulos',
                'expand menu':                   'Abrir menú',
                'collapse menu':                 'Cerrar menú',
                'select audio device':           'Seleccionar dispositivo de audio',
                'microphone':                    'Micrófono',
                'speakers':                      'Bocinas',
                'camera':                        'Cámara',
                'talk to interrupt':             'Habla para interrumpir',

                /* ---------- Chat ---------- */
                'chat':                          'Chat',
                'chat history':                  'Historial de chat',
                'chat messages':                 'Mensajes del chat',
                'open chat':                     'Abrir chat',
                'close chat':                    'Cerrar chat',
                'type your message here...':     'Escribe tu mensaje aquí...',
                'send message':                  'Enviar mensaje',
                'please wait until the response is complete': 'Espera a que termine la respuesta',
                'agent response':                'Respuesta del agente',
                'agent is thinking':             'El agente está pensando',
                'stop viewing':                  'Dejar de ver',
                'open image':                    'Abrir imagen',
                'open video':                    'Abrir video',

                /* ---------- Permisos de micrófono y cámara ---------- */
                "let's get your permission":     'Necesitamos tu permiso',
                'your browser needs permission to use your microphone.':
                  'Tu navegador necesita permiso para usar el micrófono.',
                'got a question?':               '¿Tienes una pregunta?',
                'talk to a live interactive agent, just turn on your mic to start the call.':
                  'Habla con un agente interactivo en vivo: solo enciende el micrófono para iniciar la conversación.',
                'we are blocked from using your microphone':
                  'El acceso a tu micrófono está bloqueado',
                "click the page info icon in your browser's address bar":
                  'Haz clic en el ícono de información de la página en la barra de direcciones',
                'turn on microphone access':     'Permitir acceso al micrófono',
                'we are blocked from using your camera':
                  'El acceso a tu cámara está bloqueado',
                'turn on camera access':         'Permitir acceso a la cámara',
                'camera will be available after generating your agent':
                  'La cámara estará disponible después de generar tu agente',

                /* ---------- Errores y red ---------- */
                'your network quality is low. this may affect your experience.':
                  'Tu conexión es lenta. Esto puede afectar tu experiencia.',
                'the agent is temporarily unavailable. please try again later.':
                  'El agente no está disponible por el momento. Inténtalo más tarde.',

                /* ---------- Encuesta de fin de conversación ---------- */
                'rate your experience':          'Califica tu experiencia',
                'submit':                        'Enviar',
                'thanks for your feedback!':     '¡Gracias por tus comentarios!',
                "couldn't send your feedback. please try again.":
                  'No se pudieron enviar tus comentarios. Inténtalo de nuevo.',

                /* ---------- Etiquetas de accesibilidad ---------- */
                'control header':                'Encabezado de controles',
                'main controls':                 'Controles principales',
                'welcome message':               'Mensaje de bienvenida',
                'connecting overlay':            'Pantalla de conexión',
                'agent idle video':              'Video del agente en espera',
                'agent video stream':            'Video del agente en vivo',

                // Quita esta línea si prefieres conservar el distintivo "AI"
                'ai':                            'IA',
            };

            const ATRIBUTOS = ['placeholder', 'aria-label', 'title', 'alt'];

            /* Normaliza antes de buscar. Tres cosas importan:
               - el carácter … y los tres puntos ... son intercambiables en
                 el bundle de D-ID, y no siempre usa el mismo;
               - un salto de línea o doble espacio en el markup no debe
                 impedir el match;
               - la búsqueda es en minúsculas.
               Las llaves del diccionario se escriben con "..." literal. */
            function normalizar(txt) {
                return txt
                    .replace(/\u2026/g, '...')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();
            }

            function traducir(txt) {
                if (!txt) return null;
                return TRADUCCIONES[normalizar(txt)] || null;
            }

            /* ==============================================================
               Traduce un árbol (documento o shadow root)
            ============================================================== */
            function traducirArbol(root) {
                if (!root) return;

                const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                let nodo;
                while ((nodo = walker.nextNode())) {
                    const original = nodo.nodeValue;
                    const trimmed  = original.trim();   // crudo, para reemplazar
                    if (!trimmed) continue;
                    const es = traducir(trimmed);       // normalizado, para buscar
                    // La guarda evita reescribir (y disparar el observer) cuando
                    // el texto ya está traducido, p. ej. 'Chat' → 'Chat'.
                    if (es && trimmed !== es) {
                        nodo.nodeValue = original.replace(trimmed, es);
                    }
                }

                if (!root.querySelectorAll) return;

                root.querySelectorAll('*').forEach(el => {
                    ATRIBUTOS.forEach(attr => {
                        const val = el.getAttribute && el.getAttribute(attr);
                        if (!val) return;
                        const es = traducir(val);
                        if (!es || es === val) return;
                        el.setAttribute(attr, es);
                    });
                });
            }

            /* ==============================================================
               Recorre el documento y TODOS los shadow roots.

               CLAVE — y esta era la segunda falla de la versión anterior:
               un MutationObserver sobre document.body NO detecta cambios
               dentro de un shadow root. Hay que observar cada uno por
               separado, conforme aparecen.

               El loader, el error y el botón "Volver" se excluyen: ya están
               en español y no hay razón de recorrerlos en cada pasada.
            ============================================================== */
            const observados = new WeakSet();
            let aplicando = false;
            let pendiente = null;

            function programar() {
                if (aplicando) return;
                clearTimeout(pendiente);
                pendiente = setTimeout(aplicar, 60);
            }

            const observer = new MutationObserver(() => {
                programar();
                intentarAutoClickStart();
            });
            const OPCIONES = {
                childList: true,
                subtree: true,
                characterData: true,
                attributes: true,
                attributeFilter: ATRIBUTOS,
            };

            function recorrer(root) {
                if (!root) return;
                if (root === loader || root === errorEl || root === backBtn) return;
                traducirArbol(root);

                if (!observados.has(root)) {
                    observados.add(root);
                    observer.observe(root, OPCIONES);
                }

                if (!root.querySelectorAll) return;
                root.querySelectorAll('*').forEach(el => {
                    if (el.shadowRoot) recorrer(el.shadowRoot);
                });
            }

            function aplicar() {
                aplicando = true;
                try { recorrer(document.body); } catch (e) { /* silencio */ }
                // Los callbacks del observer son microtareas; este setTimeout(0)
                // corre después, liberando el candado sin generar bucle infinito.
                setTimeout(() => { aplicando = false; }, 0);
            }

            // Red de seguridad: el widget monta tarde y crea shadow roots
            // nuevos a lo largo de la sesión (menús, encuesta final, avisos).
            const traduccionInterval = setInterval(aplicar, 1500);
            aplicar();

            /* ==============================================================
               Auditoría: qué quedó sin traducir

               D-ID cambia cadenas entre builds. Cuando aparezca una en
               inglés, abre la consola en ese momento exacto (con el aviso
               en pantalla) y ejecuta:

                   __textosPendientes()

               Imprime las cadenas que no están en el diccionario, ya con
               formato de llave para pegarlas arriba. Recorre también los
               shadow roots, que es donde vive todo el widget.

               Filtra lo que ya tradujimos, pero no distingue la UI de lo
               que dice el agente en el chat: ignora esas líneas.
            ============================================================== */
            window.__textosPendientes = function () {
                const yaTraducido = new Set(
                    Object.values(TRADUCCIONES).map(v => normalizar(v))
                );
                const hallazgos = new Map();

                function registrar(txt) {
                    if (!txt) return;
                    const clave = normalizar(txt);
                    if (!clave || clave.length > 140) return;
                    if (!/[a-z]/.test(clave)) return;        // iconos, números
                    if (/[áéíóúñ¿¡]/.test(clave)) return;    // ya está en español
                    if (TRADUCCIONES[clave]) return;
                    if (yaTraducido.has(clave)) return;
                    hallazgos.set(clave, txt.trim());
                }

                for (const r of recolectarRaices(document.body)) {
                    if (r === loader || r === errorEl || r === backBtn) continue;
                    const walker = document.createTreeWalker(r, NodeFilter.SHOW_TEXT);
                    let n;
                    while ((n = walker.nextNode())) registrar(n.nodeValue);

                    const els = r.querySelectorAll ? r.querySelectorAll('*') : [];
                    for (const el of els) {
                        for (const attr of ATRIBUTOS) {
                            if (el.getAttribute) registrar(el.getAttribute(attr));
                        }
                    }
                }

                if (!hallazgos.size) {
                    console.log('[agente-embed] nada pendiente en pantalla ahora mismo.');
                    return [];
                }
                console.log(
                    '[agente-embed] ' + hallazgos.size + ' cadena(s) sin traducir:\n\n' +
                    [...hallazgos.keys()]
                        .map(k => "                '" + k.replace(/'/g, "\\'") + "': '',")
                        .join('\n')
                );
                return [...hallazgos.values()];
            };

            /* ==============================================================
               Auto-click en el botón de inicio

               El texto real del embed v2 es "Start call", no "Start
               conversation": por eso el auto-click tampoco funcionaba. Se
               incluye también la versión en español porque la traducción
               puede ganarle la carrera al click.

               Chrome/Safari pueden bloquear el audio sin gesto del usuario.
               Si notas que el agente arranca mudo, comenta la línea marcada
               más abajo y deja que el usuario pulse el botón.
            ============================================================== */
            const patronesStart = [
                'start call',
                'iniciar conversación',
                'start conversation',
                'start a conversation',
                'start chat',
                'continue call...',
                'continuar conversación...',
            ];
            let yaClickeado = false;

            function recolectarRaices(root, acc = []) {
                acc.push(root);
                const all = (root.querySelectorAll ? root.querySelectorAll('*') : []);
                for (const el of all) {
                    if (el.shadowRoot) recolectarRaices(el.shadowRoot, acc);
                }
                return acc;
            }

            function intentarAutoClickStart() {
                if (yaClickeado) return;
                const raices = recolectarRaices(document.body);
                for (const r of raices) {
                    const candidatos = (r.querySelectorAll
                        ? r.querySelectorAll('button, [role="button"], a')
                        : []);
                    for (const el of candidatos) {
                        const txt  = ((el.textContent || '') + '').trim().toLowerCase();
                        const aria = ((el.getAttribute && el.getAttribute('aria-label')) || '').toLowerCase();
                        const hit  = patronesStart.some(p =>
                            txt === p || aria === p || txt.startsWith(p) || aria.startsWith(p));
                        if (!hit) continue;
                        yaClickeado = true;
                        console.log('[agente-embed] auto-click sobre botón de inicio:', txt || aria);
                        setTimeout(() => {
                            try { el.click(); }   // ← comenta esta línea para desactivar el auto-click
                            catch (e) { console.warn('[agente-embed] click falló:', e); }
                        }, 120);
                        return;
                    }
                }
            }

            const startCheckInterval = setInterval(() => {
                if (yaClickeado) {
                    clearInterval(startCheckInterval);
                    return;
                }
                intentarAutoClickStart();
            }, 400);

            /* ==============================================================
               Detección de "agente listo"
            ============================================================== */
            let revealed = false;
            function reveal() {
                if (revealed) return;
                revealed = true;
                clearInterval(msgInterval);
                clearInterval(videoCheckInterval);
                clearInterval(startCheckInterval);
                aplicar(); // última pasada antes de mostrar
                container.classList.add('ready');
                setTimeout(() => loader.classList.add('hidden'), 250);
            }

            function buscarVideoListo() {
                const raices = recolectarRaices(document.body);
                for (const r of raices) {
                    const v = (r.querySelector ? r.querySelector('video') : null);
                    if (v && (v.readyState >= 2 || v.currentTime > 0)) {
                        return v;
                    }
                    if (v) {
                        // Está presente pero todavía cargando frames
                        v.addEventListener('playing',    reveal, { once: true });
                        v.addEventListener('loadeddata', reveal, { once: true });
                        v.addEventListener('canplay',    reveal, { once: true });
                    }
                }
                return null;
            }

            const videoCheckInterval = setInterval(() => {
                if (buscarVideoListo()) reveal();
            }, 400);

            /* ==============================================================
               Cierre limpio al salir de la página
            ============================================================== */
            window.addEventListener('beforeunload', () => {
                clearInterval(traduccionInterval);
                const a = document.querySelector('did-agent');
                if (a && a.disconnect) a.disconnect();
            });

            /* ==============================================================
               Inyectar el script de D-ID
            ============================================================== */
            const script = document.createElement('script');
            script.type  = 'module';
            script.src   = 'https://agent.d-id.com/v4/index.js';
            script.setAttribute('data-mode',       'full');
            script.setAttribute('data-client-key', cfg.did_client_key);
            script.setAttribute('data-agent-id',   cfg.did_agent_id);
            script.setAttribute('data-name',       'did-agent');
            script.setAttribute('data-monitor',    'true');
            script.setAttribute('data-target-id',  'did-container');

            script.onerror = () => {
                clearInterval(msgInterval);
                clearInterval(videoCheckInterval);
                clearInterval(startCheckInterval);
                showError('No se pudo cargar el script del agente desde D-ID.');
            };

            document.head.appendChild(script);

            // Failsafe: si tras 12s no detectamos video listo, revelamos.
            setTimeout(() => {
                if (!revealed) {
                    console.warn('[agente-embed] failsafe — video no detectado en 12s, revelando');
                    reveal();
                }
            }, 12000);
        })();
    </script>
</body>
</html>
