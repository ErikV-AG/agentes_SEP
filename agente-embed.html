<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Person-AG</title>

    <!-- Seguro contra shadow DOM cerrado.
         El embed v2 de D-ID abre sus shadow roots (por eso benito.html
         funciona sin este parche), pero si en alguna versión los cerrara,
         la traducción dejaría de alcanzarlos. Forzar mode:'open' antes de
         cargar el SDK cuesta nada y no altera el widget visualmente.

         Debe ir como script clásico (no module) en el <head>, ANTES de
         cualquier otra cosa que pueda crear shadow DOMs. -->
    <script>
        /* Modo integrado para SaberesMX (?modo=saberes): sin login, sin
           botón "Volver" y con la paleta del sitio. Se marca aquí, antes de
           pintar, para que no se vea ni un instante el estilo por defecto. */
        if (new URLSearchParams(location.search).get('modo') === 'saberes') {
            document.documentElement.classList.add('modo-saberes');
        }
    </script>
    <script>
        /* ==================================================================
           MICRÓFONO MANUAL (modo SaberesMX)

           La conversación arranca con el micrófono apagado mientras el avatar
           saluda. El alumno toca "Toca para hablar" para abrirlo y toca de
           nuevo para terminar. También se cierra solo si el avatar empieza a
           responder, para no captar su voz por las bocinas. Se pide al
           navegador supresión de ruido y cancelación de eco.

           Interruptor: MIC_MANUAL = false restaura el micrófono original de
           D-ID. Fuera de ?modo=saberes no hace nada, aunque esté en true.
        ================================================================== */
        window.MIC_MANUAL = true;

        (function () {
            const activo = window.MIC_MANUAL === true;
            window.__micManual = { activo: activo, stream: null, alNuevoStream: [] };
            if (!activo || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

            const original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = async function (restricciones) {
                try {
                    if (restricciones && restricciones.audio) {
                        const base = restricciones.audio === true ? {} : restricciones.audio;
                        restricciones = Object.assign({}, restricciones, {
                            audio: Object.assign({ autoGainControl: true }, base, {
                                echoCancellation: true,
                                noiseSuppression: true,
                            }),
                        });
                    }
                } catch (e) {}
                const stream = await original(restricciones);
                try {
                    if (stream.getAudioTracks().length) {
                        window.__micManual.stream = stream;
                        window.__micManual.alNuevoStream.forEach(fn => { try { fn(stream); } catch (e) {} });
                    }
                } catch (e) {}
                return stream;
            };
        })();
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&family=Archivo:wght@400;500;600&display=swap">
    <script>
        (function () {
            /* Relleno de pantalla en monitores anchos.
               El video del avatar tiene la proporción de la imagen original
               (~16:9). En pantallas más anchas, D-ID rellena los lados con
               una copia desenfocada. Con este estilo, en pantallas
               horizontales más anchas que 16:9 el video cubre todo el ancho
               (recorta un poco arriba y abajo, protegiendo la cabeza).
               En celulares y pantallas verticales no se toca nada.
               Para desactivarlo: RELLENAR_ANCHO = false. */
            const RELLENAR_ANCHO = true;
            const CSS_RELLENO = `
                @media (orientation: landscape) and (min-aspect-ratio: 17/9) {
                    video {
                        object-fit: cover !important;
                        object-position: center 25% !important;
                    }
                }`;

            const orig = Element.prototype.attachShadow;
            Element.prototype.attachShadow = function (init) {
                const opts = Object.assign({}, init, { mode: 'open' });
                const root = orig.call(this, opts);
                if (RELLENAR_ANCHO) {
                    try {
                        const st = document.createElement('style');
                        st.textContent = CSS_RELLENO;
                        root.appendChild(st);
                    } catch (e) {}
                }
                return root;
            };
            // Por si el video no vive en un shadow DOM
            if (RELLENAR_ANCHO) {
                const st = document.createElement('style');
                st.textContent = CSS_RELLENO;
                document.head.appendChild(st);
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Patria';
            src: local('Patria Bold'), url('static/fonts/Patria-Bold.woff2') format('woff2');
            font-weight: 700; font-display: swap;
        }

        /* Paleta institucional Gobierno de México 2024-2030 */
        :root {
            --guinda:        #9b2247;
            --guinda-oscuro: #611232;
            --verde:         #1e5b4f;
            --verde-oscuro:  #002f2a;
            --dorado:        #a57f2c;
            --dorado-claro:  #e6d194;
            --negro:         #161a1d;
            --gris:          #98989a;
            --gris-texto:    #545454;
            --linea:         #e4e1da;
            --fondo:         #ffffff;

            /* Color propio del agente; se ajusta por JS según el key */
            --tono:          var(--guinda);

            --f-titulo: 'Patria', 'Noto Serif', Georgia, serif;
            --f-texto:  'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overscroll-behavior: none;
        }
        body {
            font-family: var(--f-texto);
            background: var(--fondo);
            color: var(--negro);
            overflow: hidden;
        }

        /* Pleca guinda + dorada en el borde superior, sobre el widget */
        .pleca {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: calc(4px + env(safe-area-inset-top, 0px));
            background: var(--guinda-oscuro);
            border-bottom: 2px solid var(--dorado);
            z-index: 30;
            pointer-events: none;
        }

        /* Botón flotante para volver al selector. Respeta notch. */
        .back-btn {
            position: fixed;
            top:  calc(18px + env(safe-area-inset-top, 0px));
            left: calc(16px + env(safe-area-inset-left, 0px));
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.94);
            border: 1px solid var(--linea);
            border-radius: 999px;
            color: var(--guinda-oscuro);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(22,26,29,0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            text-decoration: none;
        }
        .back-btn:hover {
            background: var(--guinda-oscuro);
            border-color: var(--guinda-oscuro);
            color: #fff;
        }
        .back-btn:focus-visible { outline: 3px solid var(--dorado); outline-offset: 2px; }
        .back-btn svg { fill: currentColor; }

        /* Container del agente. Empieza OCULTO hasta que el widget esté
           listo (evita ver la UI en inglés de D-ID). 100dvh = alto real
           visible en móvil; 100vh como respaldo. */
        #did-container {
            position: fixed;
            inset: 0;
            height: 100vh;
            height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 1;
        }
        #did-container.ready { opacity: 1; }

        /* Loader — cubre todo el viewport hasta el reveal */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: var(--fondo);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            text-align: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loaderName {
            font-family: var(--f-titulo);
            font-weight: 700;
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            line-height: 1.15;
            color: var(--guinda-oscuro);
            min-height: 1.15em;
        }
        /* Barra de progreso indeterminada en el color del agente */
        .progreso {
            width: 160px;
            height: 3px;
            background: var(--linea);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .progreso::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 40%;
            background: var(--tono);
            border-radius: 2px;
            animation: avance 1.3s ease-in-out infinite;
        }
        @keyframes avance {
            from { left: -40%; }
            to   { left: 100%; }
        }
        #loaderText {
            font-size: 14px;
            color: var(--gris-texto);
            min-height: 1.3em;
            transition: opacity 0.3s ease;
        }
        #loaderSubtext {
            font-size: 12px;
            color: var(--gris);
            margin-top: -8px;
        }

        /* Mensaje de error */
        .error-msg {
            position: fixed;
            inset: 0;
            z-index: 15;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 24px;
            background: var(--fondo);
        }
        .error-msg.show { display: flex; }
        .error-msg h2 {
            font-family: var(--f-titulo);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--guinda-oscuro);
        }
        .error-msg p { color: var(--gris-texto); font-size: 15px; max-width: 380px; line-height: 1.5; }
        .error-msg a {
            margin-top: 8px;
            color: #fff;
            background: var(--guinda-oscuro);
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .error-msg a:hover { background: var(--guinda); }
        .error-msg a:focus-visible { outline: 3px solid var(--dorado); outline-offset: 2px; }

        /* Celular: botón compacto, solo flecha */
        @media (max-width: 480px) {
            .back-btn {
                top:  calc(12px + env(safe-area-inset-top, 0px));
                left: calc(10px + env(safe-area-inset-left, 0px));
                padding: 7px 10px;
                font-size: 12px;
                gap: 4px;
            }
            .back-btn .back-label { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .progreso::after { animation-duration: 3s; }
            * { transition: none !important; }
        }

        /* ── Modo SaberesMX ─────────────────────────────────────────── */
        .modo-saberes {
            --tono:  #ff4f1f;           /* spray */
            --f-titulo: 'DM Serif Display', Georgia, serif;
            --f-texto:  'Archivo', 'Helvetica Neue', sans-serif;
        }
        /* Fondo transparente: dentro del marco de SaberesMX se ve el GIF
           en reposo del personaje mientras el agente conecta */
        html.modo-saberes,
        .modo-saberes body { background: transparent; color: #f5ede0; }
        .modo-saberes .loader {
            background: linear-gradient(to top, rgba(10,8,7,.82) 0%, rgba(10,8,7,.35) 45%, transparent 75%);
            justify-content: flex-end;
            padding-bottom: 36px;
            gap: 12px;
        }
        .modo-saberes #loaderName { font-size: clamp(1.5rem, 6vw, 2rem); text-shadow: 0 2px 12px rgba(0,0,0,.5); }
        .modo-saberes .error-msg { background: #6b1a2e; color: #f5ede0; }

        /* ── Botón "Toca para hablar" (micrófono manual, SaberesMX) ─── */
        .mic-manual {
            position: fixed;
            left: 50%;
            bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 25;
            display: none;
            align-items: center;
            gap: 10px;
            max-width: calc(100% - 32px);
            padding: 12px 20px 12px 16px;
            border: 0;
            border-radius: 999px;
            font: 600 15px/1.2 var(--f-texto);
            color: #fff;
            background: var(--tono, #9b2247);
            box-shadow: 0 6px 22px rgba(0, 0, 0, .35);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .mic-manual.visible { display: inline-flex; }
        .mic-manual svg { width: 20px; height: 20px; flex: none; }
        .mic-manual[data-estado="hablando"],
        .mic-manual[data-estado="pensando"] {
            background: rgba(10, 8, 7, .72);
            color: #f5ede0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .mic-manual[data-estado="pensando"] { cursor: default; }
        .mic-manual[data-estado="escuchando"] { background: #f5ede0; color: #0a0807; }
        .mic-manual:focus-visible { outline: 3px solid #b08938; outline-offset: 3px; }
        .mic-nivel { display: none; align-items: center; gap: 3px; height: 18px; }
        .mic-manual[data-estado="escuchando"] .mic-nivel { display: inline-flex; }
        .mic-nivel i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--tono, #9b2247); transition: height .08s linear; }
        @media (prefers-reduced-motion: reduce) { .mic-nivel i { transition: none; } }
        .modo-saberes .pleca,
        .modo-saberes .back-btn { display: none !important; }
        .modo-saberes #loaderName { color: #f5ede0; font-weight: 400; }
        .modo-saberes .progreso { background: rgba(245,237,224,.2); }
        .modo-saberes #loaderText { color: rgba(245,237,224,.7); }
        .modo-saberes #loaderSubtext {
            color: rgba(245,237,224,.45);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            letter-spacing: .12em; text-transform: uppercase; font-size: 10px;
        }
        .modo-saberes .error-msg h2 { color: #f5ede0; font-weight: 400; }
        .modo-saberes .error-msg p  { color: rgba(245,237,224,.7); }
        .modo-saberes .error-msg a  { display: none; }
        .modo-saberes .mic-manual { background: #ff4f1f; }
        .modo-saberes .mic-manual[data-estado="escuchando"] { background: #f5ede0; color: #0a0807; }
        .modo-saberes .mic-manual[data-estado="hablando"],
        .modo-saberes .mic-manual[data-estado="pensando"] { background: rgba(10,8,7,.72); color: #f5ede0; }
        .modo-saberes .mic-nivel i { background: #ff4f1f; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn" title="Volver al selector de agentes" aria-label="Volver al selector de agentes">

        <span class="back-label">Volver</span>

    <div id="did-container"></div>

    <div class="error-msg" id="errorMsg">

        <p id="errorDetail">Revisa la configuración del agente en este archivo.</p>
        <a href="index.html">Volver al inicio</a>
    </div>

    <script>
        /* ==================================================================
           CONFIGURACIÓN DE LOS AGENTES
           Pega aquí el Agent ID y el Client Key de cada agente, tal como
           aparecen en D-ID Studio → Agents → Embed. Sustituye a /api/agents.
        ================================================================== */
        const AGENTES = {
            benito: {
                name:           'Benito Juárez',
                did_agent_id:   'v2_agt_noml6Z11',
                did_client_key: 'ck_Y6Dqt6YNh3tpL9E-SAZ_m',
            },
            leona: {
                name:           'Leona Vicario',
                did_agent_id:   'v2_agt__10ZAKLZ',
                did_client_key: 'ck_GFzeAf0dUICThCdDI9bFn',
            },
            rosario: {
                name:           'Rosario Castellanos',
                did_agent_id:   'v2_agt_vtZylOBe',
                did_client_key: 'ck_0_4F0mhTgq4RzeAseBzbw',
            },
            zaragoza: {
                name:           'Ignacio Zaragoza',
                did_agent_id:   'v2_agt_qXRpM8aN',
                did_client_key: 'ck_-SyPE_hZzRQWhERKvanv-',
            },
            hidalgo: {
                name:           'Miguel Hidalgo',
                did_agent_id:   'v2_agt_sLdfDODM',
                did_client_key: 'ck_Up9xEjc4YkczGXrCM7ZaK',
            },
            elvia: {
                name:           'Elvia Carrillo Puerto',
                did_agent_id:   'v2_agt_lhTXfbPP',
                did_client_key: 'ck_WDQ2iW9SIMliODy9514gF',
            },
            rita: {
                name:           'Rita Cetina Gutiérrez',
                did_agent_id:   'v2_agt_j-C0ZqjA',
                did_client_key: 'ck_3Cw2SHGxtjeUCCdm46rgR',
            },
            matilde: {
                name:           'Matilde Montoya',
                did_agent_id:   'v2_agt_TMjVCPJk',
                did_client_key: 'ck_kaqUuM_EDQOd1dCC5R4Cz',
            },
            tlacaelel: {
                name:           'Tlacaélel',
                did_agent_id:   'v2_agt_5ewGmGlV',
                did_client_key: 'ck_z1ME-zmw1Hv05QX_N-TSS',
            },
            rulfo: {
                name:           'Juan Rulfo',
                did_agent_id:   'v2_agt_JQ51su3p',
                did_client_key: 'ck_UCJTA8XLfm-8u8A3SznCL',
            },
        };

        // Auth check (el modo SaberesMX no pide código: el sitio es la entrada)
        const MODO_SABERES = document.documentElement.classList.contains('modo-saberes');
        if (!MODO_SABERES && sessionStorage.getItem('ag_auth') !== 'true') {
            window.location.href = 'login.html';
        }

        (async function () {
            'use strict';

            const params      = new URLSearchParams(window.location.search);
            const agentKey    = params.get('key');
            const loader      = document.getElementById('loader');
            const loaderText  = document.getElementById('loaderText');
            const container   = document.getElementById('did-container');
            const errorEl     = document.getElementById('errorMsg');
            const errorDt     = document.getElementById('errorDetail');
            const backBtn     = document.querySelector('.back-btn');
            if (MODO_SABERES) {
                document.getElementById('loaderSubtext').textContent = 'Habla con la historia · SaberesMX';
            }
            const loaderName  = document.getElementById('loaderName');

            // Color institucional de cada agente (igual que en el selector)
            const TONOS = { benito: '--guinda', leona: '--verde', rosario: '--dorado', zaragoza: '--verde-oscuro', hidalgo: '--guinda-oscuro', elvia: '--guinda', rita: '--verde-oscuro', matilde: '--dorado', tlacaelel: '--verde', rulfo: '--guinda-oscuro' };
            if (TONOS[agentKey] && !MODO_SABERES) {   // en SaberesMX se queda el naranja del sitio
                document.documentElement.style.setProperty('--tono', `var(${TONOS[agentKey]})`);
            }

            function showError(msg) {
                if (msg) errorDt.textContent = msg;
                errorEl.classList.add('show');
                loader.classList.add('hidden');
            }

            if (!agentKey) {
                showError('Falta el parámetro "key" en la URL. Ejemplo: agente-embed.html?key=benito');
                return;
            }

            // ── Config del agente (sin backend) ───────────────────────────
            const cfg = AGENTES[agentKey];

            if (!cfg)                                            { showError(`El agente "${agentKey}" no existe. Los disponibles son: ${Object.keys(AGENTES).join(", ")}.`); return; }
            if (!cfg.did_agent_id || !cfg.did_client_key ||
                cfg.did_agent_id.startsWith('PEGA_') || cfg.did_client_key.startsWith('PEGA_')) {
                showError(`Faltan el Agent ID o el Client Key de ${cfg.name || agentKey}. Agrégalos en la sección AGENTES al inicio del script de agente-embed.html.`);
                return;
            }

            // ── Loader animado ────────────────────────────────────────────
            document.title         = `${cfg.name || agentKey} — Person-AG`;
            loaderName.textContent = cfg.name || agentKey;
            loaderText.textContent = 'Conectando…';

            const mensajes = [
                'Conectando…',
                'Preparando interacción…',
                'Casi listo…',
            ];
            let idx = 0;
            const msgInterval = setInterval(() => {
                idx = Math.min(idx + 1, mensajes.length - 1);
                loaderText.style.opacity = '0';
                setTimeout(() => {
                    loaderText.textContent = mensajes[idx];
                    loaderText.style.opacity = '1';
                }, 250);
            }, 3500);

            /* ==============================================================
               DICCIONARIO DEL EMBED D-ID v2 (build 2.1.27)

               Las llaves son las cadenas EXACTAS del bundle, en minúsculas;
               la búsqueda normaliza a minúsculas antes de comparar. Esto es
               lo que fallaba antes: el diccionario anterior tenía cadenas
               inventadas ("Start conversation", "Listening…", "Click to
               talk") que el widget nunca emite, y comparaba respetando
               mayúsculas.

               El widget solo trae inglés y alemán de fábrica: no existe
               opción de configuración para español, por eso se parchea el
               DOM.

               "call" se traduce siempre como "conversación", no "llamada".
            ============================================================== */
            const TRADUCCIONES = {

                /* ---------- Arranque / conexión ---------- */
                'start call':                    'Iniciar conversación',
                'starting...':                   'Iniciando...',
                'connecting...':                 'Conectando...',
                'loading...':                    'Cargando...',

                /* Pantalla de conexión (build posterior al 2.1.27).
                   Se registran la frase completa y sus dos mitades por

                'agent video stream':            'Video del agente en vivo',

                // Quita esta línea si prefieres conservar el distintivo "AI"
                'ai':                            'IA',
            };

            const ATRIBUTOS = ['placeholder', 'aria-label', 'title', 'alt'];

            /* Normaliza antes de buscar. Tres cosas importan:
               - el carácter … y los tres puntos ... son intercambiables en
                 el bundle de D-ID, y no siempre usa el mismo;
               - lo mismo con el apóstrofo tipográfico ’ y el recto ';
               - un salto de línea o doble espacio en el markup no debe
                 impedir el match;
               - la búsqueda es en minúsculas.
               Las llaves del diccionario se escriben con "..." literal. */
            function normalizar(txt) {
                return txt
                    .replace(/\u2026/g, '...')
                    .replace(/[\u2018\u2019\u02bc]/g, "'")   // won’t → won't
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();
            }

            function traducir(txt) {
                if (!txt) return null;
                return TRADUCCIONES[normalizar(txt)] || null;
            }

            /* ==============================================================
               Traduce un árbol (documento o shadow root)
            ============================================================== */
            function traducirArbol(root) {
                if (!root) return;

                const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                let nodo;
                while ((nodo = walker.nextNode())) {
                    const original = nodo.nodeValue;
                    const trimmed  = original.trim();   // crudo, para reemplazar
                    if (!trimmed) continue;
                    const es = traducir(trimmed);       // normalizado, para buscar
                    // La guarda evita reescribir (y disparar el observer) cuando
                    // el texto ya está traducido, p. ej. 'Chat' → 'Chat'.
                    if (es && trimmed !== es) {
                        nodo.nodeValue = original.replace(trimmed, es);
                    }
                }

                if (!root.querySelectorAll) return;

                root.querySelectorAll('*').forEach(el => {
                    ATRIBUTOS.forEach(attr => {
                        const val = el.getAttribute && el.getAttribute(attr);
                        if (!val) return;
                        const es = traducir(val);
                        if (!es || es === val) return;
                        el.setAttribute(attr, es);
                    });
                });
            }

            /* ==============================================================
               Recorre el documento y TODOS los shadow roots.

               CLAVE — y esta era la segunda falla de la versión anterior:
               un MutationObserver sobre document.body NO detecta cambios
               dentro de un shadow root. Hay que observar cada uno por
               separado, conforme aparecen.

               El loader, el error y el botón "Volver" se excluyen: ya están
               en español y no hay razón de recorrerlos en cada pasada.
            ============================================================== */
            const observados = new WeakSet();
            let aplicando = false;
            let pendiente = null;

            function programar() {
                if (aplicando) return;
                clearTimeout(pendiente);
                pendiente = setTimeout(aplicar, 60);
            }

            const observer = new MutationObserver(() => {
                programar();
                intentarAutoClickStart();
            });
            const OPCIONES = {
                childList: true,
                subtree: true,
                characterData: true,
                attributes: true,
                attributeFilter: ATRIBUTOS,
            };

            function recorrer(root) {
                if (!root) return;
                if (root === loader || root === errorEl || root === backBtn) return;
                traducirArbol(root);

                if (!observados.has(root)) {
                    observados.add(root);
                    observer.observe(root, OPCIONES);
                }

                if (!root.querySelectorAll) return;
                root.querySelectorAll('*').forEach(el => {
                    if (el.shadowRoot) recorrer(el.shadowRoot);
                });
            }

            function aplicar() {
                aplicando = true;
                try { recorrer(document.body); } catch (e) { /* silencio */ }
                // Los callbacks del observer son microtareas; este setTimeout(0)
                // corre después, liberando el candado sin generar bucle infinito.
                setTimeout(() => { aplicando = false; }, 0);
            }

            // Red de seguridad: el widget monta tarde y crea shadow roots
            // nuevos a lo largo de la sesión (menús, encuesta final, avisos).
            const traduccionInterval = setInterval(aplicar, 1500);
            aplicar();

            /* ==============================================================
               Auditoría: qué quedó sin traducir

               D-ID cambia cadenas entre builds. Cuando aparezca una en
               inglés, abre la consola en ese momento exacto (con el aviso
               en pantalla) y ejecuta:

                   __textosPendientes()

               Imprime las cadenas que no están en el diccionario, ya con
               formato de llave para pegarlas arriba. Recorre también los
               shadow roots, que es donde vive todo el widget.

               Filtra lo que ya tradujimos, pero no distingue la UI de lo
               que dice el agente en el chat: ignora esas líneas.
            ============================================================== */
            window.__textosPendientes = function () {
                const yaTraducido = new Set(
                    Object.values(TRADUCCIONES).map(v => normalizar(v))
                );
                const hallazgos = new Map();

                function registrar(txt) {
                    if (!txt) return;
                    const clave = normalizar(txt);
                    if (!clave || clave.length > 140) return;
                    if (!/[a-z]/.test(clave)) return;        // iconos, números
                    if (/[áéíóúñ¿¡]/.test(clave)) return;    // ya está en español
                    if (TRADUCCIONES[clave]) return;
                    if (yaTraducido.has(clave)) return;
                    hallazgos.set(clave, txt.trim());
                }

                for (const r of recolectarRaices(document.body)) {
                    if (r === loader || r === errorEl || r === backBtn) continue;
                    const walker = document.createTreeWalker(r, NodeFilter.SHOW_TEXT);
                    let n;
                    while ((n = walker.nextNode())) registrar(n.nodeValue);

                    const els = r.querySelectorAll ? r.querySelectorAll('*') : [];
                    for (const el of els) {
                        for (const attr of ATRIBUTOS) {
                            if (el.getAttribute) registrar(el.getAttribute(attr));
                        }
                    }
                }

                if (!hallazgos.size) {
                    console.log('[agente-embed] nada pendiente en pantalla ahora mismo.');
                    return [];
                }
                console.log(
                    '[agente-embed] ' + hallazgos.size + ' cadena(s) sin traducir:\n\n' +
                    [...hallazgos.keys()]
                        .map(k => "                '" + k.replace(/'/g, "\\'") + "': '',")
                        .join('\n')
                );
                return [...hallazgos.values()];
            };

            /* ==============================================================
               Botón de inicio: lo pulsa la persona, no el script

               Antes el script "tocaba" el botón por su cuenta. En celulares
               eso falla: el navegador solo concede el micrófono (y el audio)
               de forma confiable cuando la persona toca la pantalla en ese
               momento. Un toque simulado puede terminar en permiso negado,
               y el navegador recuerda esa negativa para el sitio.
               Además, arrancar solo abría una sesión de D-ID con cada visita,
               aunque nadie fuera a hablar, y eso agota las sesiones
               simultáneas del plan ("Alta demanda").

               Ahora el script solo espera a que aparezca el botón de inicio
               (ya traducido) y en ese momento muestra el widget para que la
               persona lo pulse. AUTO_INICIO = true restaura el
               comportamiento anterior (no recomendado).
            ============================================================== */
            const AUTO_INICIO = false;

            const patronesStart = [
                'start call',
                'iniciar conversación',
                'start new call',
                'iniciar nueva conversación',
                'start conversation',
                'start a conversation',
                'start chat',
            ];
            let yaClickeado = false;   // "ya encontramos el botón de inicio"

            function recolectarRaices(root, acc = []) {
                acc.push(root);
                const all = (root.querySelectorAll ? root.querySelectorAll('*') : []);
                for (const el of all) {
                    if (el.shadowRoot) recolectarRaices(el.shadowRoot, acc);
                }
                return acc;
            }

            function intentarAutoClickStart() {
                if (yaClickeado) return;
                const raices = recolectarRaices(document.body);
                for (const r of raices) {
                    const candidatos = (r.querySelectorAll
                        ? r.querySelectorAll('button, [role="button"], a')
                        : []);
                    for (const el of candidatos) {
                        const txt  = ((el.textContent || '') + '').trim().toLowerCase();
                        const aria = ((el.getAttribute && el.getAttribute('aria-label')) || '').toLowerCase();
                        const hit  = patronesStart.some(p =>
                            txt === p || aria === p || txt.startsWith(p) || aria.startsWith(p));
                        if (!hit) continue;
                        yaClickeado = true;
                        if (AUTO_INICIO) {
                            console.log('[agente-embed] auto-inicio:', txt || aria);
                            setTimeout(() => {
                                try { el.click(); }
                                catch (e) { console.warn('[agente-embed] click falló:', e); }
                            }, 120);
                        } else {
                            console.log('[agente-embed] botón de inicio listo, esperando a la persona');
                            reveal();
                        }
                        return;
                    }
                }
            }

            const startCheckInterval = setInterval(() => {
                if (yaClickeado) {
                    clearInterval(startCheckInterval);
                    return;
                }
                intentarAutoClickStart();
            }, 400);

            /* ==============================================================
               Detección de "agente listo"
            ============================================================== */
            let revealed = false;
            function reveal() {
                if (revealed) return;
                revealed = true;
                clearInterval(msgInterval);
                clearInterval(videoCheckInterval);
                clearInterval(startCheckInterval);
                aplicar(); // última pasada antes de mostrar
                container.classList.add('ready');
                setTimeout(() => loader.classList.add('hidden'), 250);
            }

            function buscarVideoListo() {
                const raices = recolectarRaices(document.body);
                for (const r of raices) {
                    const v = (r.querySelector ? r.querySelector('video') : null);
                    if (v && (v.readyState >= 2 || v.currentTime > 0)) {
                        return v;
                    }
                    if (v) {
                        // Está presente pero todavía cargando frames
                        v.addEventListener('playing',    reveal, { once: true });
                        v.addEventListener('loadeddata', reveal, { once: true });
                        v.addEventListener('canplay',    reveal, { once: true });
                    }
                }
                return null;
            }

            const videoCheckInterval = setInterval(() => {
                if (buscarVideoListo()) reveal();
            }, 400);

            /* ==============================================================
               Cierre limpio al salir de la página
            ============================================================== */
            /* Cerrar la sesión de D-ID al salir. Si la sesión queda
               abierta, sigue ocupando un lugar del plan hasta que D-ID
               la expira, y el siguiente visitante cae en la sala de
               espera ("Buscando al agente"). */
            function cerrarSesion() {
                clearInterval(traduccionInterval);
                const candidatos = [
                    document.querySelector('did-agent'),
                    window['did-agent'],
                    ...container.querySelectorAll('*'),
                ];
                for (const a of candidatos) {
                    if (!a) continue;
                    for (const m of ['disconnect', 'destroy', 'close']) {
                        try { if (typeof a[m] === 'function') a[m](); } catch (e) {}
                    }
                }
                document.querySelectorAll('video').forEach(v => {
                    try {
                        const st = v.srcObject;
                        if (st && st.getTracks) st.getTracks().forEach(t => t.stop());
                    } catch (e) {}
                });
            }
            window.addEventListener('pagehide', cerrarSesion);
            window.addEventListener('beforeunload', cerrarSesion);
            backBtn.addEventListener('click', cerrarSesion);

            /* ==============================================================
               Inyectar el script de D-ID
            ============================================================== */
            const script = document.createElement('script');
            script.type  = 'module';
            script.src   = 'https://agent.d-id.com/v2/index.js';
            script.setAttribute('data-mode',       'full');
            script.setAttribute('data-client-key', cfg.did_client_key);
            script.setAttribute('data-agent-id',   cfg.did_agent_id);
            script.setAttribute('data-name',       'did-agent');
            script.setAttribute('data-monitor',    'true');
            script.setAttribute('data-target-id',  'did-container');

            script.onerror = () => {
                clearInterval(msgInterval);
                clearInterval(videoCheckInterval);
                clearInterval(startCheckInterval);
                showError('No se pudo cargar el script del agente desde D-ID.');
            };

            document.head.appendChild(script);

            if (window.__micManual && window.__micManual.activo) {
                iniciarMicManual(cfg.name || agentKey);
            }

            /* ==============================================================
               Micrófono manual: "toca una vez para hablar" y se cierra solo
               cuando el alumno deja de hablar. Si algo de la API de D-ID no
               responde, no se toca nada y el widget funciona como siempre.
            ============================================================== */
            function iniciarMicManual(nombre) {
                const btn    = document.getElementById('micManual');
                const texto  = btn.querySelector('.mic-texto');
                const barras = Array.from(btn.querySelectorAll('.mic-nivel i'));
                const primerNombre = String(nombre || '').split(' ')[0];

                const SILENCIO_MS = 1500;      // no se usa: cierre manual
                const SIN_VOZ_MS  = 8000;      // no se usa: cierre manual
                const CIERRE_MANUAL = true;    // tocar para hablar / tocar para terminar
                const MAXIMO_MS   = 25000;  // tope de seguridad
                const UMBRAL      = 0.02;   // nivel (RMS) que cuenta como voz

                let api = null, estado = 'oculto', conectado = false, actividad = 'IDLE';
                let ctx = null, analizador = null, fuente = null, pistaClon = null;
                let temporizador = 0, tInicio = 0, tUltimaVoz = 0, huboVoz = false;

                const log = (...a) => console.log('[mic-manual]', ...a);

                function silenciar(si) {
                    try { api.functions.toggleMicState(si); }   // true = silenciar
                    catch (e) { log('toggleMicState falló', e); }
                }

                function pintar(nuevo) {
                    estado = nuevo;
                    btn.dataset.estado = nuevo;
                    btn.classList.toggle('visible', nuevo !== 'oculto');
                    const textos = {
                        listo:      'Toca para hablar',
                        escuchando: 'Te escucho… toca para terminar',
                        hablando:   primerNombre ? `Habla ${primerNombre} · toca para interrumpir` : 'Toca para interrumpir',
                        pensando:   'Pensando…',
                    };
                    if (textos[nuevo]) texto.textContent = textos[nuevo];
                }

                function prepararAnalizador() {
                    const st = window.__micManual.stream;
                    if (!st) return false;
                    try {
                        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                        if (ctx.state === 'suspended') ctx.resume();
                        if (fuente && fuente.__origen === st) return true;
                        const pista = st.getAudioTracks()[0];
                        if (!pista || pista.readyState === 'ended') return false;
                        if (pistaClon) try { pistaClon.stop(); } catch (e) {}
                        pistaClon = pista.clone();
                        pistaClon.enabled = true;   // independiente del silencio de D-ID
                        fuente = ctx.createMediaStreamSource(new MediaStream([pistaClon]));
                        fuente.__origen = st;
                        analizador = ctx.createAnalyser();
                        analizador.fftSize = 1024;
                        fuente.connect(analizador);
                        return true;
                    } catch (e) {
                        log('sin detector de silencio; se cerrará por respuesta del agente o por tiempo', e);
                        analizador = null; fuente = null;
                        return false;
                    }
                }

                function medir() {
                    const ahora = performance.now();
                    if (analizador) {
                        const datos = new Float32Array(analizador.fftSize);
                        analizador.getFloatTimeDomainData(datos);
                        let suma = 0;
                        for (let i = 0; i < datos.length; i++) suma += datos[i] * datos[i];
                        const rms = Math.sqrt(suma / datos.length);
                        barras.forEach((b, i) => {
                            const alto = 4 + Math.min(14, rms * 380 * (0.55 + ((i * 3) % 5) / 8));
                            b.style.height = alto.toFixed(1) + 'px';
                        });
                        if (rms > UMBRAL) { huboVoz = true; tUltimaVoz = ahora; }
                        if (!CIERRE_MANUAL) {
                            if (huboVoz && ahora - tUltimaVoz > SILENCIO_MS) return terminarEscucha('silencio');
                            if (!huboVoz && ahora - tInicio > SIN_VOZ_MS) return terminarEscucha('no habló');
                        }
                    }
                    if (ahora - tInicio > MAXIMO_MS) return terminarEscucha('tiempo máximo');
                }

                function empezarEscucha() {
                    prepararAnalizador();
                    silenciar(false);
                    pintar('escuchando');
                    tInicio = tUltimaVoz = performance.now();
                    huboVoz = false;
                    clearInterval(temporizador);
                    temporizador = setInterval(medir, 60);
                }

                function terminarEscucha(motivo) {
                    clearInterval(temporizador);
                    temporizador = 0;
                    barras.forEach(b => { b.style.height = '4px'; });
                    silenciar(true);
                    log('micrófono cerrado:', motivo);
                    if (!conectado) return pintar('oculto');
                    pintar(actividad === 'TALKING' ? 'hablando'
                         : (actividad === 'LOADING' || actividad === 'BUFFERING') ? 'pensando'
                         : 'listo');
                }

                btn.addEventListener('click', () => {
                    if (estado === 'escuchando') return terminarEscucha('toque del alumno');
                    if (estado === 'pensando' || estado === 'oculto') return;
                    if (estado === 'hablando') {
                        try { api.functions.interrupt(); } catch (e) {}
                    }
                    empezarEscucha();
                });

                // Si D-ID vuelve a abrir el micrófono (nuevo stream), rehacer el medidor
                window.__micManual.alNuevoStream.push(() => {
                    fuente = null; analizador = null;
                    if (estado === 'escuchando') prepararAnalizador();
                });

                function conectarEventos() {
                    api.events.on('connection', ({ state }) => {
                        const s = String(state || '').toLowerCase();
                        log('conexión:', s);
                        if (s === 'connected' && !conectado) {
                            conectado = true;
                            silenciar(true);   // arranca callado mientras el avatar saluda
                            try { api.configure({ showMicToggle: false }); } catch (e) {}
                            pintar(actividad === 'TALKING' ? 'hablando' : 'listo');
                        }
                        if (['disconnected', 'disconnecting', 'closed', 'fail'].includes(s)) {
                            conectado = false;
                            if (estado === 'escuchando') terminarEscucha('desconexión');
                            pintar('oculto');
                        }
                    });

                    api.events.on('agentActivity', ({ state }) => {
                        actividad = String(state || '').toUpperCase();
                        if (!conectado) return;
                        if (actividad === 'TALKING' || actividad === 'LOADING' || actividad === 'BUFFERING') {
                            // El agente ya recibió la pregunta o está hablando: micrófono fuera
                            if (estado === 'escuchando') terminarEscucha('respuesta del agente');
                            else silenciar(true);
                            pintar(actividad === 'TALKING' ? 'hablando' : 'pensando');
                        } else if (actividad === 'IDLE' && estado !== 'escuchando') {
                            silenciar(true);   // por si D-ID lo reabrió por su cuenta
                            pintar('listo');
                        }
                    });
                }

                // Esperar la API de D-ID (hasta 30 s); si no aparece, no se toca nada
                const t0 = Date.now();
                const espera = setInterval(() => {
                    const candidato = [window.DID_AGENTS_API, window['did-agent']]
                        .find(a => a && a.events && a.functions);
                    if (candidato) {
                        clearInterval(espera);
                        api = candidato;
                        log('API de D-ID lista');
                        conectarEventos();
                    } else if (Date.now() - t0 > 30000) {
                        clearInterval(espera);
                        log('API de D-ID no disponible: micrófono con el comportamiento original');
                    }
                }, 200);

                window.addEventListener('pagehide', () => {
                    try { if (pistaClon) pistaClon.stop(); } catch (e) {}
                    try { if (ctx) ctx.close(); } catch (e) {}
                });
            }


            // Failsafe: si tras 12s no detectamos video listo, revelamos.
            setTimeout(() => {
                if (!revealed) {
                    console.warn('[agente-embed] failsafe — video no detectado en 12s, revelando');
                    reveal();
                }
            }, 12000);
        })();
    </script>
